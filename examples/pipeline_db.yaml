source:
  type: db
  connection_string: "sqlite:///examples/sample.db"
  query: "SELECT * FROM people"

cleaning:
  dedupe: true
  missing_value_strategy: median
  missing_value_overrides:
    city: mode
  string_normalize: true
  outlier_strategy: iqr_cap

validation:
  - type: not_null
    column: name
  - type: unique
    column: id
  - type: range
    column: salary
    params:
      min: 0
      max: 200000

report:
  output_dir: examples/output_db
  formats: [html, pdf]
  title: "Sample Data Science Report (from SQLite)"
